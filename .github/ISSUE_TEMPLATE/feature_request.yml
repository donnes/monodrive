name: Feature request
description: Propose a change to what Monodrive does.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: A maintainer needs to agree to the direction and scope before you open a PR. See CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what takes too long?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should Monodrive do, in the window and for agents over MCP?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
