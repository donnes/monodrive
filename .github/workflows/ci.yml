name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # macOS is a required check, so the workflow can't use paths-ignore: a
  # workflow that never starts leaves the check pending. A job skipped by its
  # `if` passes instead.
  changes:
    name: Changed files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        uses: actions/github-script@v8
        with:
          script: |
            // Files that no build, lint or test reads.
            const docs = /(\.md$|^\.plans\/|^public\/|^assets\/|^LICENSE$|^NOTICE$)/;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const code = files.some((file) => !docs.test(file.filename));
            core.info(`${files.length} files, code changed: ${code}`);
            core.setOutput("code", code);

  macos:
    name: macOS
    needs: changes
    # Pushes to main skip `changes` and always run.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Design
        run: scripts/check design
      - name: Format
        run: scripts/check format
      - name: Clippy
        run: scripts/check clippy
      - name: Tests
        run: scripts/check test

  deny:
    name: Dependencies and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
