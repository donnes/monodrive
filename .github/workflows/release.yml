name: Release

# Nightly runs daily from main, skipping a commit that already has a nightly.
# Both channels run on demand from the Actions tab.
# Stable creates the vX.Y.Z tag on the commit it built, and needs the signing secrets.
#
# Signing and notarizing use these secrets. Without them a nightly is ad hoc signed.
#   CSC_LINK           base64 of the Developer ID Application .p12
#   CSC_KEY_PASSWORD   the .p12's password
#   APPLE_API_KEY      contents of the App Store Connect .p8
#   APPLE_API_KEY_ID   its key ID
#   APPLE_API_ISSUER   its issuer ID
#
# OPENROUTER_API_KEY, optional, has Claude summarize the changes in the notes.

on:
  schedule:
    # Avoid minute zero, when GitHub's scheduled jobs are busiest.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Channel
        type: choice
        options: [nightly, stable]
        default: nightly
      version:
        description: Stable version, like 0.2.0. Empty is one patch past the last stable.
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      due: ${{ steps.plan.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CHANNEL: ${{ inputs.channel || 'nightly' }}
          STABLE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Releases build from main, not $GITHUB_REF."
            exit 1
          fi
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -v -x -e 'v.*-nightly\..*' | head -1 || true)
          # Cargo.toml only names the first release. Nightlies count from the
          # next patch, so one always sorts after the stable before it.
          next=$cargo_version
          if [[ -n "$latest" ]]; then
            IFS=. read -r major minor patch <<< "${latest#v}"
            next=$major.$minor.$((patch + 1))
          fi
          due=true
          if [[ "$CHANNEL" == stable ]]; then
            channel=stable
            version=${STABLE_VERSION:-$next}
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::\"$version\" isn't a version like 0.2.0."
              exit 1
            fi
            if git rev-parse --quiet --verify "refs/tags/v$version" >/dev/null; then
              echo "::error::v$version is already released."
              exit 1
            fi
            if [[ -z "$CSC_LINK" ]]; then
              echo "::error::A stable release must be signed and notarized, and the signing secrets aren't set."
              exit 1
            fi
            previous=$latest
          else
            channel=nightly
            version=$next-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER
            previous=$(git tag --list 'v*-nightly.*' --sort=-v:refname | head -1 || true)
            if [[ "$GITHUB_EVENT_NAME" == schedule && -n "$(git tag --points-at HEAD --list 'v*-nightly.*')" ]]; then
              echo "This commit already has a nightly."
              due=false
            fi
          fi
          {
            echo "channel=$channel"
            echo "version=$version"
            echo "previous_tag=$previous"
            echo "due=$due"
          } >> "$GITHUB_OUTPUT"

  check:
    name: macOS
    needs: prepare
    if: needs.prepare.outputs.due == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check

  deny:
    name: Dependencies and licenses
    needs: prepare
    if: needs.prepare.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  build:
    name: Build
    needs: [prepare, check, deny]
    runs-on: macos-26
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # This job holds the signing key, so it runs no third-party action and
      # restores no cache.
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - id: signing
        name: Load the signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [[ -z "$CSC_LINK" ]]; then
            echo "::warning::The signing secrets aren't set, so this build is ad hoc signed and not notarized."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "MONODRIVE_SIGN_IDENTITY=Developer ID Application"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - env:
          VERSION: ${{ needs.prepare.outputs.version }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: scripts/release "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: target/release/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The notes read the commits back to the previous tag.
          fetch-depth: 0
          persist-credentials: false
      # Without notes the release falls back to GitHub's generated ones.
      - name: Write release notes
        continue-on-error: true
        timeout-minutes: 5
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: scripts/release-notes "$VERSION" "$PREVIOUS_TAG" "$GITHUB_SHA" "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          notes=$RUNNER_TEMP/notes.md
          args=("v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Monodrive $VERSION")
          if [[ -f "$notes" ]]; then
            if [[ "$SIGNED" != true ]]; then
              warning="This build isn't notarized, so macOS blocks it. After copying it to Applications, run \`xattr -d com.apple.quarantine /Applications/Monodrive.app\`."
              printf '%s\n\n%s\n' "$warning" "$(cat "$notes")" > "$notes"
            fi
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
            if [[ -n "$PREVIOUS_TAG" ]]; then
              args+=(--notes-start-tag "$PREVIOUS_TAG")
            fi
          fi
          if [[ "$CHANNEL" == nightly ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release create "${args[@]}"
