name: Release

# Nightly runs daily from main, skipping a commit that already has a nightly,
# and on demand from the Actions tab. Stable runs when a vX.Y.Z tag that matches
# Cargo.toml's version is pushed, and needs the signing secrets.
#
# Signing and notarizing use these secrets. Without them a nightly is ad hoc signed.
#   CSC_LINK           base64 of the Developer ID Application .p12
#   CSC_KEY_PASSWORD   the .p12's password
#   APPLE_API_KEY      contents of the App Store Connect .p8
#   APPLE_API_KEY_ID   its key ID
#   APPLE_API_ISSUER   its issuer ID

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  schedule:
    # Avoid minute zero, when GitHub's scheduled jobs are busiest.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      due: ${{ steps.plan.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          due=true
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            channel=stable
            version=${GITHUB_REF_NAME#v}
            if [[ "$version" != "$cargo_version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $cargo_version."
              exit 1
            fi
            if [[ -z "$CSC_LINK" ]]; then
              echo "::error::A stable release must be signed and notarized, and the signing secrets aren't set."
              exit 1
            fi
            previous=$(git tag --list 'v*' --sort=-v:refname | grep -v -x -e "$GITHUB_REF_NAME" -e 'v.*-nightly\..*' | head -1 || true)
          else
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "::error::Nightlies build from main, not $GITHUB_REF."
              exit 1
            fi
            channel=nightly
            version=$cargo_version-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER
            previous=$(git tag --list 'v*-nightly.*' --sort=-v:refname | head -1 || true)
            if [[ "$GITHUB_EVENT_NAME" == schedule && -n "$(git tag --points-at HEAD --list 'v*-nightly.*')" ]]; then
              echo "This commit already has a nightly."
              due=false
            fi
          fi
          {
            echo "channel=$channel"
            echo "version=$version"
            echo "previous_tag=$previous"
            echo "due=$due"
          } >> "$GITHUB_OUTPUT"

  check:
    name: macOS
    needs: prepare
    if: needs.prepare.outputs.due == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check

  deny:
    name: Dependencies and licenses
    needs: prepare
    if: needs.prepare.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  build:
    name: Build
    needs: [prepare, check, deny]
    runs-on: macos-26
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # This job holds the signing key, so it runs no third-party action and
      # restores no cache.
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - id: signing
        name: Load the signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [[ -z "$CSC_LINK" ]]; then
            echo "::warning::The signing secrets aren't set, so this build is ad hoc signed and not notarized."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "MONODRIVE_SIGN_IDENTITY=Developer ID Application"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - env:
          VERSION: ${{ needs.prepare.outputs.version }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: scripts/release "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: target/release/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          args=("v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --title "Monodrive $VERSION" --generate-notes)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          if [[ "$CHANNEL" == nightly ]]; then
            args+=(--prerelease --latest=false --target "$GITHUB_SHA")
          else
            args+=(--latest --verify-tag)
          fi
          if [[ "$SIGNED" != true ]]; then
            args+=(--notes "This build isn't notarized, so macOS blocks it. After copying it to Applications, run \`xattr -d com.apple.quarantine /Applications/Monodrive.app\`.")
          fi
          gh release create "${args[@]}"
