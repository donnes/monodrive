name: PR Size

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label PR size
    runs-on: ubuntu-24.04
    concurrency:
      group: pr-size-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Reads the diff through the API, so this job with a write token never
      # fetches or checks out a fork's code.
      - uses: actions/github-script@v8
        with:
          script: |
            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            // Upper bounds of changed lines. The label definitions live in the repo's settings.
            const sizes = [
              ["size:XS", 10],
              ["size:S", 30],
              ["size:M", 100],
              ["size:L", 500],
              ["size:XL", 1000],
              ["size:XXL", Infinity],
            ];
            const generated = /^(vendor\/|Cargo\.lock$)/;
            const test = /(^|\/)(tests\/|(\w+_)?tests\.rs$)/;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: issue_number,
              per_page: 100,
            });
            const count = (list) => list.reduce((total, file) => total + file.changes, 0);
            const authored = files.filter((file) => !generated.test(file.filename));
            const nonTest = count(authored.filter((file) => !test.test(file.filename)));
            // A PR that only changes tests is sized by its tests.
            const lines = nonTest === 0 ? count(authored) : nonTest;
            const [next] = sizes.find(([, limit]) => lines < limit);

            const current = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            for (const { name } of current) {
              if (name !== next && sizes.some(([size]) => size === name)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              }
            }
            if (!current.some(({ name }) => name === next)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [next] });
            }

            core.info(`PR #${issue_number}: ${lines} lines -> ${next}`);
