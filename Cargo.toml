[workspace]
resolver = "3"
members = ["crates/monodrive", "crates/monodrive-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
monodrive-core = { path = "crates/monodrive-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Monocode's patched GPUI: the Apple renderer's alpha and font-matching fixes,
# and no screen-capture dependency. Sync these from Monocode, don't edit them here.
# Skip the Windows backend when syncing: Monodrive never targets Windows.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }

# GPUI is slow unoptimized and slow to build with full debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

# Our own crates too, so holding an arrow key never outruns rendering.
[profile.dev.package.monodrive]
opt-level = 1

[profile.dev.package.monodrive-core]
opt-level = 1
