# The most each measured thing may take, judged on the median of this build's
# samples by `scripts/bench`'s report. Budgets are for an M3 Pro-class Mac with
# the files in the disk cache. A change that pushes a number past its budget
# needs a fix, or a new budget here with `why`.
#
# `bench` is "suite/bench" as in results.json.

[[budget]]
bench = "core/list_dir/10000"
what = "List a folder of 10,000 entries"
median_ms = 20

[[budget]]
bench = "core/list_dir/100000"
what = "List a folder of 100,000 entries"
median_ms = 150
why = "Plan 25's target: donnes-pc lists 100,000 entries unsorted in about 150 ms. Monodrive took 127 ms, sort included, on 2026-11-03."

[[budget]]
bench = "core/sort/name"
what = "Sort 10,000 shuffled entries by name"
median_ms = 3

[[budget]]
bench = "core/sort/kind"
what = "Sort 10,000 shuffled entries by kind"
median_ms = 3

[[budget]]
bench = "core/sort/size"
what = "Sort 10,000 shuffled entries by size"
median_ms = 3

[[budget]]
bench = "core/sort/modified"
what = "Sort 10,000 shuffled entries by date"
median_ms = 3

[[budget]]
bench = "core/naming/suggest"
what = "Suggest names for five text files"
median_ms = 250
why = "Suggest Names' gate is 50 ms a file."

[[budget]]
bench = "frames/scroll_list"
what = "Draw a frame while scrolling the list of 10,000 entries, p99"
median_ms = 4
why = "1.6 ms on 2026-11-03."

[[budget]]
bench = "frames/scroll_grid"
what = "Draw a frame while scrolling the grid of 10,000 entries, p99"
median_ms = 4
why = "2.3 ms on 2026-11-03."

[[budget]]
bench = "frames/drag_over_list"
what = "Draw a frame while dragging a file over 10,000 entries, p99"
median_ms = 4
why = "2.5 ms on 2026-11-03."

[[budget]]
bench = "frames/slide_sidebar_list"
what = "Draw a frame while the sidebar slides over the list of 10,000 entries, p99"
median_ms = 4
why = "1.5 to 2.2 ms on 2026-11-03."

[[budget]]
bench = "frames/slide_sidebar_grid"
what = "Draw a frame while the sidebar slides over the grid of 10,000 entries, p99"
median_ms = 4
why = "1.5 to 2.2 ms on 2026-11-03."

[[budget]]
bench = "launch/contents"
what = "Launch to drawing the folder's contents, warm, release build"
median_ms = 150
why = "127 ms on 2026-10-31, through cargo run with the app activating."

[[budget]]
bench = "launch/shown"
what = "Launch to the folder's contents on the display, warm, release build"
median_ms = 200
why = "A median of 161 ms in docs/performance.md's Launch."
