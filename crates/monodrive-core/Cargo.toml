[package]
name = "monodrive-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
# Moves files to the Trash the way Finder does, lists and ejects volumes, and
# reads what Get Info shows, through Foundation.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSArray", "NSAttributedString", "NSBundle", "NSDictionary", "NSEnumerator", "NSError", "NSFileManager", "NSGeometry", "NSString", "NSURL", "NSValue"] }
# Open With, through NSWorkspace.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "NSAttributedString", "NSColor", "NSFont", "NSFontDescriptor", "NSGraphicsContext", "NSRunningApplication", "NSStringDrawing", "NSWorkspace"] }
block2 = "0.6"
# Video and other thumbnails, from the generator Finder uses, and their JPEGs
# for agents.
objc2-quick-look-thumbnailing = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "QLThumbnailGenerationRequest", "QLThumbnailGenerator", "QLThumbnailRepresentation", "bitflags"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFDictionary", "CFString", "CFURL"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGAffineTransform", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGPath"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
# Flattens recipes into pictures and exports edited video.
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "objc2-core-graphics", "CGImageDestination", "CGImageProperties", "CGImageSource"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media", "AVAsset", "AVAssetExportSession", "AVAssetImageGenerator", "AVAssetTrack", "AVComposition", "AVCompositionTrack", "AVMediaFormat", "AVVideoCompositing", "AVVideoComposition"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime", "CMTimeRange"] }
# A PDF's title and first page, for suggested names.
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "PDFDocument", "PDFPage"] }
# Compares names the way APFS does, which ignores Unicode normalization.
unicode-normalization = "0.1"
fsearch.workspace = true
# Writes ZIP archives, deflate only. Monodrive reads them itself, so it can
# bound what it loads; flate2 and crc32fast are zip's own, for that.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1.5"
# Unicode case folding, to tell when two archive entries are one name.
caseless = "0.2"
# Hashes whole files to confirm duplicates before any are offered for cleanup.
blake3 = "1.8"
# Orders releases, whose nightly numbers compare as numbers.
semver = "1"
# Generates the MCP tools' schemas from the types that decode their arguments.
schemars = "1"

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
