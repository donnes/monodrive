[package]
name = "monodrive-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
# Moves files to the Trash the way Finder does, lists and ejects volumes, and
# reads what Get Info shows, through Foundation.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSBundle", "NSDictionary", "NSError", "NSFileManager", "NSString", "NSURL", "NSValue"] }
# Open With, through NSWorkspace.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSRunningApplication", "NSWorkspace"] }
block2 = "0.6"
# Compares names the way APFS does, which ignores Unicode normalization.
unicode-normalization = "0.1"
# No crates.io release yet, so it's pinned to a commit. Bump deliberately.
fsearch = { git = "https://github.com/noahdunnagan/fsearch", rev = "88e63fdf850cf7749deae8198b187accd21f8ba5" }
# Writes ZIP archives, deflate only. Monodrive reads them itself, so it can
# bound what it loads; flate2 and crc32fast are zip's own, for that.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1.5"
# Unicode case folding, to tell when two archive entries are one name.
caseless = "0.2"
# Hashes whole files to confirm duplicates before any are offered for cleanup.
blake3 = "1.8"
# Orders releases, whose nightly numbers compare as numbers.
semver = "1"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "listing"
harness = false
