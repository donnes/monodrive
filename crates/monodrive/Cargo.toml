[package]
name = "monodrive"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
monodrive-core.workspace = true
async-channel = "2"
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "runtime_shaders"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-segmentation = "1"
# Pins the traffic lights to Monocode's spacing, draws Finder's icons, puts
# files on the pasteboard, hands them to Finder and Terminal, previews
# them with Quick Look, and taps the trackpad.
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-quartz-core", "objc2-uniform-type-identifiers", "NSAccessibility", "NSBitmapImageRep", "NSButton", "NSControl", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSHapticFeedback", "NSImage", "NSImageRep", "NSLayoutAnchor", "NSLayoutConstraint", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSScreen", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSArray", "NSGeometry", "NSString", "NSURL"] }
# Finder's sounds, through AudioToolbox.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFURL"] }
objc2-quick-look-ui = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "QLPreviewItem", "QLPreviewPanel", "QLPreviewView"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTCoreTypes", "UTType"] }
raw-window-handle = "0.6"
serde.workspace = true
# preserve_order: adding an agent rewrites its config without reordering it.
serde_json = { workspace = true, features = ["preserve_order"] }
# Decodes and bakes background effects; GPUI's features decide the formats.
image = { version = "0.25", default-features = false }
# The patched Metal renderer's background mask.
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.9" }
# When the process started, for the `profile` feature's launch time.
libc = { version = "0.2", optional = true }

# The preview's players and its sandboxed HTML page.
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-media", "objc2-quartz-core", "AVAnimation", "AVPlayer", "AVPlayerItem", "AVPlayerLayer"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "CALayer"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKContentRuleList", "WKContentRuleListStore", "WKFrameInfo", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKPreferences", "WKUserContentController", "WKWebView", "WKWebViewConfiguration", "WKWebpagePreferences", "WKWebsiteDataStore"] }
# The preview's Markdown and colored text. Syntect's pure-Rust regex engine
# keeps a C library out of the build; its syntaxes load only when a file needs them.
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

[features]
# Prints the launch time once the folder's contents are drawn, and frame
# times when the app quits: `cargo run -p monodrive --release --features profile`.
profile = ["gpui/profiler", "dep:libc"]

[dev-dependencies]
tempfile = "3"
# GPUI's view tests (`#[gpui::test]`) and Criterion benchmarks (`#[gpui::bench]`).
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["bench", "test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "runtime_shaders", "bench-support"] }

[[bench]]
name = "scrolling"
harness = false
